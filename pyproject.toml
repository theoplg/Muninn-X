[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muninnx"
version = "0.0.1"
description = "Muninn-style certified caching for flow-matching samplers"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy",
  "matplotlib",
  "pyyaml",
  "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["muninnx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
